.k-shake{animation:k-shake .45s var(--ease)}
@keyframes k-shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.k-pop{animation:k-pop .35s var(--spring)}

.k-toast.show{opacity:1;transform:translate(-50%,0)}

:root[data-theme="dark"]{--bg:#0f151a;--surface:#182025;--surface-2:#232d34;--line:#38444d;--ink:#f0f3f5;--ink-2:#c5cdd3;--muted:#94a0a8;--acc:#7ec8ff;--acc-ink:#0e151b;--acc-soft:#2e4555;--ok:#5fd39a;--ok-soft:#173626;--warn:#f2c14e;--warn-soft:#3a3212;--bad:#ff6b6b;--bad-soft:#3d1a20}

var tt,ttT; K.toast=function(m){ if(!tt){ tt=document.createElement('div'); tt.className='k-toast'; tt.setAttribute('role','status'); document.body.appendChild(tt); } tt.textContent=m; tt.classList.add('show'); clearTimeout(ttT); ttT=setTimeout(function(){ tt.classList.remove('show'); },2000); };
/* stagger entrance for freshly rendered lists: K.stagger(container) */
K.stagger=function(root,max){ if(!root||reduced) return; var kids=root.children,n=Math.min(kids.length,max||14); for(var i=0;i<n;i++){ kids[i].style.setProperty('--i',i); kids[i].classList.add('k-in'); } };
/* delegated haptics on primary buttons */
document.addEventListener('pointerdown',function(e){ var b=e.target.closest&&e.target.closest('.k-btn.primary,.k-chip,.k-seg button'); if(b) K.tick(6); },{passive:true});
/* sticky header shadow */
var top=document.querySelector('.k-top.sticky'); if(top){ var on=false; window.addEventListener('scroll',function(){ var s=window.scrollY>8; if(s!==on){ on=s; top.classList.toggle('scrolled',s); } },{passive:true}); }
})();

 de:{h:"Vereinsfest-Küche",s:"Lebensmittelsicherheit für den Stand am Fest. Abhaken, was erledigt ist; ! = wenn das fehlt, gibt es das Fest nicht. Der Stand wird im Browser gespeichert, nichts wird gesendet.",ht:"Die vier Zahlen, die zählen",print:"Drucken",reset:"Zurücksetzen",done:"erledigt",

   sec:[["Vorher (Woche davor)",[

     ["Meldung an die Gemeinde / Lebensmittelkontrolle prüfen","Öffentliche Abgabe von Lebensmitteln ist meldepflichtig; Fest und Stand beim Kanton (Lebensmittelkontrolle Bern) oder der Gemeinde anmelden, sofern nicht die Veranstaltung das übernimmt.",1],
     ["Menü einfach halten","Wenige Gerichte, die man durchgaren kann. Nichts mit rohem Ei, keine Mayonnaise selber machen, keine Tartare.",0],

   foot:'Zusammengestellt aus der Berufspraxis eines Kochs nach den Grundsätzen der Guten Hygienepraxis (Lebensmittelgesetz LMG, Hygieneverordnung HyV, Leitlinie für Vereine und Festwirtschaften). Es ist eine Checkliste, keine Rechtsberatung: die Meldepflicht und die Anforderungen klärt der Kanton, in Bern das <a href="https://www.weu.be.ch/de/start/themen/lebensmittel-gebrauchsgegenstaende.html">Kantonale Laboratorium / Lebensmittelkontrolle</a>. Kein Tracking. <a href="https://github.com/richardcervenka111-create/vereinsfest-kueche">GitHub</a> · MIT'},
 en:{h:"Club-fest kitchen",s:"Food safety for your stand at the fest. Tick what is done; ! = without this, there is no fest. State is kept in the browser, nothing is sent.",ht:"The four numbers that matter",print:"Print",reset:"Reset",done:"done",

   foot:'Compiled from a chef’s practice following good hygiene practice principles (Swiss Food Act, Hygiene Ordinance, guideline for clubs and fest catering). A checklist, not legal advice: notification duty and requirements are set by the canton, in Bern the <a href="https://www.weu.be.ch/de/start/themen/lebensmittel-gebrauchsgegenstaende.html">Cantonal Laboratory / food inspectorate</a>. No tracking. <a href="https://github.com/richardcervenka111-create/vereinsfest-kueche">GitHub</a> · MIT'},
 sk:{h:"Kuchyňa na spolkovej slávnosti",s:"Bezpečnosť potravín pre stánok na slávnosti. Odškrtni hotové; ! = bez toho sa slávnosť nekoná. Stav sa ukladá v prehliadači, nič sa neposiela.",ht:"Štyri čísla, na ktorých záleží",print:"Tlačiť",reset:"Vynulovať",done:"hotové",
   temps:[["≤ 5 °C","Chladiaci reťazec: mäso, ryby, mliečne výrobky, šaláty s majonézou"],["≥ 65 °C","Udržiavanie teplé: všetko uvarené, čo nejde hneď von"],["≥ 72 °C","Teplota v jadre pri varení, 2 minúty; hydina a mleté vždy"],["2 h","Maximum bez chladenia alebo ohrevu, potom preč"]],
   sec:[["Vopred (týždeň pred)",[

     ["Voda na stánku","Umývanie rúk s tečúcou vodou, mydlom, jednorazovými utierkami. Bez umývadla žiadny stánok.",1],
     ["Nakúpiť neskoro, doviezť v chlade","Čerstvé deň vopred alebo ráno, chladiaci reťazec z obchodu na stánok bez prerušenia (box v aute, nie kufor na slnku).",0],
   ]],["V deň, pred otvorením",[
     ["Kontrola teplomerom","≤ 5 °C zmerané a zapísané (čas, hodnota). Nad 8 °C: tovar posúdiť, nie dúfať.",1],
     ["Ruky, vlasy, šperky, rany","Umyť ruky na začiatku a po každej zmene (peniaze, WC, odpad). Vlasy zopnuté, prstene dole, vodotesná náplasť plus rukavica.",1],
     ["Oddeliť surové a hotové","Osobitné dosky a nože na surové mäso (červené) a hotové (zelené). Surové dole v chladničke, hotové hore.",1],
     ["Oddeliť peniaze a jedlo","Jeden človek pokladňa, jeden jedlo. Ak to nejde: rukavica na jedlo, dole na peniaze.",0],

let lang="de"; const KEY="vereinsfest-state"; let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){state={};}
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function render(){ const T=L[lang]; document.documentElement.lang=lang; document.title=T.h; $("h").textContent=T.h; $("s").textContent=T.s; $("ht").textContent=T.ht; $("print").textContent=T.print; $("reset").textContent=T.reset; $("foot").innerHTML=T.foot;
  $("temps").innerHTML=T.temps.map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("");
  let total=0,done=0; $("lists").innerHTML=T.sec.map((sec,si)=>`<h2>${esc(sec[0])}</h2>`+sec[1].map((it,ii)=>{ const k=si+"-"+ii; total++; if(state[k]) done++; return `<label class="it${it[2]?" crit":""}${state[k]?" done":""}"><input type="checkbox" data-k="${k}"${state[k]?" checked":""}><div><b>${esc(it[0])}</b><span>${esc(it[1])}</span></div></label>`; }).join("")).join("");
  $("bar").style.width=(total?done/total*100:0)+"%"; $("pt").textContent=`${done} / ${total} ${T.done}`;
  document.querySelectorAll("input[data-k]").forEach(c=>c.addEventListener("change",()=>{ state[c.dataset.k]=c.checked; if(c.checked) K.tick(10); save(); render(); }));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false")); }
$("print").classList.add("k-btn","primary"); $("reset").classList.add("k-btn"); $("print").addEventListener("click",()=>window.print()); $("reset").addEventListener("click",()=>{ state={}; save(); render(); K.toast(T().reset+" ✓"); });
const T=()=>L[lang];
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l; render();}));
render();
})();
